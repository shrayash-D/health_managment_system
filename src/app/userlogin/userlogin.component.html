<div class="page">
  <section class="hero">
    <div class="container">
      <div class="hero-inner">
        <h1>Login</h1>
        <p>Welcome back. Please sign in to continue.</p>
      </div>
    </div>
  </section>

  <main class="container">
    <section class="card login-card">
      <!-- Bind Reactive Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-grid" novalidate>
        
        <!-- Email -->
        <div class="form-field span-2">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="name@example.com" />
          <div class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <small *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</small>
            <small *ngIf="loginForm.get('email')?.errors?.['email']">Enter a valid email</small>
          </div>
        </div>

        <!-- Role -->
        <div class="form-field span-2">
          <label for="role">Role</label>
          <select id="role" formControlName="role">
            <option value="" disabled>Select your role</option>
            <option value="doctor">Doctor</option>
            <option value="patient">Patient</option>
            <option value="admin">Admin</option>
          </select>
          <div class="error" *ngIf="loginForm.get('role')?.invalid && loginForm.get('role')?.touched">
            <small>Role is required</small>
          </div>
        </div>

        <!-- Password -->
        <div class="form-field span-2">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input
              id="password"
              [type]="passwordType"
              formControlName="password"
              placeholder="Enter password"
            />
            <!-- <button type="button" class="icon-btn eye" (click)="togglePassword()">
              {{ passwordVisible ? "🙈" : "👁️" }}
            </button> -->
          </div>
          <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <small *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</small>
            <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Minimum 6 characters</small>
          </div>
        </div>

        <!-- Actions -->
        <div class="form-actions span-2">
          <label class="checkbox">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>

          <div class="buttons">
            <a class="link" routerLink="/signup">Create account</a>
            <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid" >
              Login
            </button>
          </div>
        </div>
      </form>
    </section>
  </main>
</div>
