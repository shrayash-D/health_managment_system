<div class="page">
  <section class="hero">
    <div class="container">
      <div class="hero-inner">
        <h1>Diagnosis Form</h1>
        <p>Document patient complaints, findings, diagnosis codes, and plan.</p>
      </div>
    </div>
  </section>

  <main class="container">
    <!-- Patient & Encounter Card -->
    <section class="card form-card">
      <h2 class="form-title">Patient &amp; Encounter</h2>

      <form
        class="form-grid"
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        novalidate
      >
        <div class="form-field">
          <label for="pid">Patient ID</label>
          <input
            id="pid"
            type="text"
            formControlName="pid"
            placeholder="P123"
          />
        </div>

        <div class="form-field">
          <label for="pname">Name</label>
          <input
            id="pname"
            type="text"
            formControlName="pname"
            placeholder="Anita Deshmukh"
          />
        </div>

        <div class="form-field">
          <label for="dob">DOB</label>
          <input id="dob" type="date" formControlName="dob" />
        </div>

        <div class="form-field">
          <label for="encDate">Encounter Date</label>
          <input id="encDate" type="date" formControlName="encDate" />
        </div>

        <div class="form-field span-2">
          <label for="chief">Chief Complaint</label>
          <input
            id="chief"
            type="text"
            formControlName="chief"
            placeholder="Short description…"
          />
        </div>

        <div class="form-field span-2">
          <label for="history">History &amp; Symptoms</label>
          <textarea
            id="history"
            rows="6"
            formControlName="history"
            placeholder="History of present illness, ROS…"
          ></textarea>
        </div>

        <div class="form-field">
          <label for="diagnosis">Diagnosis (ICD‑10)</label>
          <input
            id="diagnosis"
            type="text"
            formControlName="diagnosis"
            placeholder="E11.9 (Type 2 diabetes mellitus)"
          />
        </div>

        <div class="form-field">
          <label for="severity">Severity</label>
          <select id="severity" formControlName="severity">
            <option *ngFor="let s of severities" [value]="s">{{ s }}</option>
          </select>
        </div>

        <div class="form-field span-2">
          <label for="plan">Assessment &amp; Plan</label>
          <textarea
            id="plan"
            rows="6"
            formControlName="plan"
            placeholder="Assessment, investigations, treatment plan…"
          ></textarea>
        </div>

        <div class="form-actions span-2">
          <div class="left">
            <label class="checkbox">
              <input type="checkbox" formControlName="followupRequired" />
              <span>Follow‑up required within 7 days</span>
            </label>
          </div>

          <div class="buttons">
            <button
              type="button"
              class="btn btn-outline"
              (click)="onSaveDraft()"
              [disabled]="savingDraft || submitting"
            >
              Save Draft
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="form.invalid || submitting"
            >
              Finalize Diagnosis
            </button>
          </div>
        </div>
      </form>
    </section>
  </main>
</div>
