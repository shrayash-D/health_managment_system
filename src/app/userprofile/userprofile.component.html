<div class="page">
  <section class="hero">
    <div class="container">
      <div class="hero-inner">
        <!-- Left side content -->
        <div>
          <h1>User Profile</h1>
          <p>View and update your account information.</p>
        </div>
      </div>
    </div>
  </section>
</div>

<main class="container">
  <!-- Profile Header -->
  <section class="card profile-header">
    <div class="left">
      <div class="avatar" aria-hidden="true"></div>
      <div class="info">
        <h2 class="name">Shrayash Desai</h2>
        <div class="meta">
          <span class="chip">Role: Patient</span>
          <span class="chip">Member since: 2023</span>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-outline">Change photo</button>
      <button class="btn btn-primary">Edit Profile</button>
    </div>
  </section>

  <!-- Profile Details (2-column responsive form) -->
  <section class="card form-card">
    <h2 class="form-title">Account Details</h2>
    <form class="form-grid" novalidate>
      <div class="form-field">
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" value="Shrayash Desai" />
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" value="shrayash@example.com" />
      </div>
      <div class="form-field">
        <label for="phone">Phone</label>
        <input id="phone" type="tel" value="+91 98XXX XXX90" />
      </div>
      <div class="form-field">
        <label for="dob">Date of Birth</label>
        <input id="dob" type="date" />
      </div>

      <div class="form-field span-2">
        <label for="address">Address</label>
        <textarea
          id="address"
          rows="3"
          placeholder="Street, City, State, PIN"
        ></textarea>
      </div>

      <div class="form-actions span-2">
        <div class="buttons">
          <button type="button" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </div>
    </form>
  </section>

  <!-- Security Card -->
  <section class="card form-card">
    <h2 class="form-title">Security</h2>
    <form class="form-grid" novalidate>
      <div class="form-field">
        <label for="currPass">Current Password</label>
        <input id="currPass" type="password" placeholder="••••••••" />
      </div>
      <div class="form-field">
        <label for="newPass">New Password</label>
        <input id="newPass" type="password" placeholder="Min 8 chars" />
      </div>
      <div class="form-field">
        <label for="confirmPass">Confirm New Password</label>
        <input
          id="confirmPass"
          type="password"
          placeholder="Re-enter password"
        />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update Password</button>
      </div>
    </form>
  </section>
</main>
