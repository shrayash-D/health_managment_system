<div class="patient-management">
  <!-- Header -->
  <div class="page-header">
    <h2>Patient Management</h2>
    <button class="btn btn-primary" (click)="openAddModal()">
      + Add Patient
    </button>
  </div>

  <!-- Search Bar -->
  <div class="search-bar">
    <input
      type="text"
      class="form-control input-brand"
      placeholder="Search patients by name, contact, or blood group..."
      [(ngModel)]="searchTerm"
    />
  </div>

  <!-- Patients Table -->
  <div class="table-container" *ngIf="patients$ | async as patients">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Contact</th>
          <th>Date of Birth</th>
          <th>Blood Group</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let patient of getFilteredPatients(patients)">
          <td>{{ patient.id }}</td>
          <td>
            <strong>{{ patient.name }}</strong>
          </td>
          <td>{{ patient.contactInfo }}</td>
          <td>{{ patient.dob }}</td>
          <td>
            <span class="badge badge-soft" *ngIf="patient.bloodGroup">{{
              patient.bloodGroup
            }}</span>
          </td>
        </tr>
        <tr *ngIf="getFilteredPatients(patients).length === 0">
          <td colspan="7" class="text-center text-muted-500">
            No patients found
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add Patient Modal -->
  <div class="modal-overlay" *ngIf="showAddModal" (click)="closeAddModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>Add New Patient</h3>
        <button class="btn-close" (click)="closeAddModal()">×</button>
      </div>
      <div class="modal-body">
        <form>
          <div class="form-group">
            <label>Name *</label>
            <input
              type="text"
              class="form-control input-brand"
              [(ngModel)]="newPatient.name"
              name="name"
              required
            />
          </div>
          <div class="form-group">
            <label>Contact Info *</label>
            <input
              type="text"
              class="form-control input-brand"
              [(ngModel)]="newPatient.contactInfo"
              name="contactInfo"
              required
            />
          </div>
          <div class="form-group">
            <label>Date of Birth *</label>
            <input
              type="date"
              class="form-control input-brand"
              [(ngModel)]="newPatient.dob"
              name="dob"
              required
            />
          </div>
          <div class="form-group">
            <label>Blood Group</label>
            <input
              type="text"
              class="form-control input-brand"
              [(ngModel)]="newPatient.bloodGroup"
              name="bloodGroup"
            />
          </div>
          <div class="form-group">
            <label>Medical History</label>
            <textarea
              class="form-control input-brand"
              [(ngModel)]="newPatient.medicalHistory"
              name="medicalHistory"
              rows="3"
            ></textarea>
          </div>
          <div class="form-group">
            <label>Primary Physician</label>
            <input
              type="text"
              class="form-control input-brand"
              [(ngModel)]="newPatient.primaryPhysician"
              name="primaryPhysician"
            />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" (click)="closeAddModal()">
          Cancel
        </button>
        <button class="btn btn-primary" (click)="addPatient()">
          Add Patient
        </button>
      </div>
    </div>
  </div>
</div>
