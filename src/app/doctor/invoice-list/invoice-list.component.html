<div class="page">
  <!-- Hero Banner -->
  <section class="hero">
    <div class="container">
      <div class="hero-inner">
        <h1>Invoice List</h1>
        <p>Manage and view all invoices generated by the doctor.</p>
      </div>
    </div>
  </section>

  <main class="container">
    <!-- Filters -->
    <section class="card">
      <h2 class="form-title">Filters</h2>
      <div class="filters">
        <select [(ngModel)]="statusFilter">
          <option value="">All Status</option>
          <option value="PAID">PAID</option>
          <option value="UNPAID">UNPAID</option>
        </select>
        <input type="date" [(ngModel)]="dateFilter" placeholder="Filter by date">
      </div>
      
    </section>

    <!-- Invoice Table -->
    <section class="card">
      <h2 class="form-title">Invoices</h2>
      <table>
        <thead>
          <tr>
            <th>Invoice ID</th>
            <th>Patient Name</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let invoice of filteredInvoices">
            <td>{{ invoice.id }}</td>
            <td>{{ invoice.patientName }}</td>
            <td>${{ invoice.amount.toFixed(2) }}</td>
            <td>
              <span class="chip" [ngClass]="{'paid': invoice.paymentStatus === 'PAID', 'unpaid': invoice.paymentStatus !== 'PAID'}">
                {{ mapStatus(invoice.paymentStatus) }}
              </span>
            </td>
            <td>{{ invoice.date }}</td>
            <td>
              <button class="btn btn-primary" (click)="viewDetails(invoice)">View Details</button>
            </td>
            <td><div class="export-buttons">
        <button class="btn btn-outline" (click)="exportToCSV()">Export to CSV</button>
        <button class="btn btn-outline" (click)="exportToPDF()">Export to PDF</button>
      </div></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
