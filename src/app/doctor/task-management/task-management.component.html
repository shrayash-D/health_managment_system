<form (ngSubmit)="addTask()" class="task-form">
 

 <app-profile-sidebar (collapsedChange)="onSidebarCollapse($event)"></app-profile-sidebar>

<div class="profile-content" [class.collapsed]="sidebarCollapsed">
  <div class="page">
    <!-- Hero Banner -->
    <section class="hero">
      <div class="container">
        <div class="hero-inner">
          <h1>Task Management</h1>
          <p>Manage and track all your tasks and assignments.</p>
        </div>
      </div>
    </section>

    <main class="container">
      <!-- Task Form -->
      <section class="card">
        <h2 class="form-title">Add New Task</h2>
        <form (ngSubmit)="addTask()" class="task-form">
          <input
            type="text"
            [(ngModel)]="newTaskTitle"
            name="taskTitle"
            placeholder="Enter task title..."
            required
          />

          <textarea
            [(ngModel)]="newTaskDescription"
            name="taskDescription"
            placeholder="Enter task details..."
          ></textarea>

          <input
            type="date"
            [(ngModel)]="newTaskDate"
            name="taskDate"
          />

          <select [(ngModel)]="newTaskPriority" name="taskPriority">
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
          </select>

          <button type="submit" class="btn btn-primary">Add Task</button>
        </form>
      </section>

      <!-- Task List -->
      <section class="card">
        <h2 class="form-title">Task List</h2>
        <ul class="task-list">
          <li *ngFor="let task of tasks">
            <div class="task-info">
              <label>
                <input
                  type="checkbox"
                  [checked]="task.completed"
                  (change)="toggleTask(task)"
                />
                <span [class.completed]="task.completed">{{ task.title }}</span>
              </label>
              <p *ngIf="task.description">{{ task.description }}</p>
              <small *ngIf="task.dueDate">Due: {{ task.dueDate }}</small>
              <span class="chip" [ngClass]="task.priority?.toLowerCase()">
                {{ task.priority }}
              </span>
            </div>
            <button class="btn btn-outline" (click)="deleteTask(task.id)">
              ❌ Delete 
            </button>
          </li>
        </ul>
      </section>
    </main>
  </div>
</div>


  
</form>
