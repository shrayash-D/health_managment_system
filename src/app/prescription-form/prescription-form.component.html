
<div class="page">
  <section class="hero">
    <div class="container">
      <div class="hero-inner">
        <h1>Prescription</h1>
        <p>Create patient prescriptions with dose, route, frequency, and instructions.</p>
      </div>
    </div>
  </section>

  <main class="container">
    <!-- Patient & Doctor Header -->
    <section class="card form-card">
      <h2 class="form-title">Patient & Prescriber</h2>

      <form class="form-grid" novalidate>
        <div class="form-field">
          <label for="pid">Patient ID</label>
          <input id="pid" type="text" placeholder="P123" />
        </div>
        <div class="form-field">
          <label for="pname">Patient Name</label>
          <input id="pname" type="text" placeholder="Anita Deshmukh" />
        </div>
        <div class="form-field">
          <label for="doctor">Prescribing Doctor</label>
          <input id="doctor" type="text" placeholder="Dr. Jon Miller" />
        </div>
        <div class="form-field">
          <label for="license">License / Reg. No.</label>
          <input id="license" type="text" placeholder="MMC/123456" />
        </div>

        <!-- Rx table -->
        <div class="span-2">
          <div class="rx-head">
            <h3>Medications</h3>
            <button type="button" class="icon-btn">＋</button>
          </div>

          <div class="table-wrap">
            <table class="table rx-table">
              <thead>
                <tr>
                  <th>Drug</th>
                  <th>Dose</th>
                  <th>Route</th>
                  <th>Frequency</th>
                  <th>Duration</th>
                  <th>Qty</th>
                  <th>Refills</th>
                  <th>Instructions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><input type="text" placeholder="Amoxicillin" /></td>
                  <td><input type="text" placeholder="500 mg" /></td>
                  <td>
                    <select><option>PO</option><option>IV</option><option>IM</option><option>Topical</option></select>
                  </td>
                  <td><input type="text" placeholder="BID" /></td>
                  <td><input type="text" placeholder="5 days" /></td>
                  <td><input type="number" placeholder="10" /></td>
                  <td><input type="number" placeholder="0" /></td>
                  <td><input type="text" placeholder="After meals" /></td>
                </tr>
                <tr>
                  <td><input type="text" placeholder="Paracetamol" /></td>
                  <td><input type="text" placeholder="650 mg" /></td>
                  <td>
                    <select><option>PO</option><option>IV</option><option>IM</option><option>Topical</option></select>
                  </td>
                  <td><input type="text" placeholder="PRN" /></td>
                  <td><input type="text" placeholder="As needed" /></td>
                  <td><input type="number" placeholder="15" /></td>
                  <td><input type="number" placeholder="0" /></td>
                  <td><input type="text" placeholder="If fever > 100°F" /></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="form-field span-2">
          <label for="notes">General Notes</label>
          <textarea id="notes" rows="6" placeholder="Precautions, advice, follow-up…"></textarea>
        </div>

        <div class="form-actions span-2">
          <div class="left">
            <label class="checkbox">
              <input type="checkbox" />
              <span>Allow generic substitution</span>
            </label>
          </div>
          <div class="buttons">
            <button type="button" class="btn btn-outline">Preview</button>
            <button type="submit" class="btn btn-primary">Save & Print</button>
          </div>
        </div>
      </form>
    </section>
  </main>
</div>
