<div class="page">
  <section class="hero">
    <div class="container">
      <div class="hero-inner">
        <!-- Left side content -->
        <div>
          <!-- Profile Header -->
          <section class="card profile-header">
            <div *ngIf="loading" style="text-align: center; padding: 20px">
              Loading...
            </div>
            <div *ngIf="!loading" class="left">
              <div class="avatar" aria-hidden="true">
                <img
                  *ngIf="tempPhotoUrl || photoPreview"
                  [src]="tempPhotoUrl || photoPreview"
                  alt="avatar"
                />
              </div>
              <div class="info">
                <h2 class="name">{{ displayName }}</h2>
                <div class="meta">
                  <span class="chip">{{ displayEmail }}</span>
                  <!-- <span class="chip">Member since: 2023</span> -->
                </div>
              </div>
            </div>
            <div *ngIf="!loading" class="actions">
              <input
                type="file"
                #fileInput
                accept="image/*"
                hidden
                (change)="onPhotoSelect($event)"
              />
              <button
                class="btn btn-outline"
                type="button"
                (click)="fileInput.click()"
              >
                Change photo
              </button>
              <button
                *ngIf="tempPhotoUrl"
                class="btn btn-primary"
                type="button"
                (click)="savePhoto()"
              >
                Save Photo
              </button>
              <button
                *ngIf="photoPreview || tempPhotoUrl"
                class="btn btn-outline"
                type="button"
                (click)="removePhoto()"
              >
                Remove photo
              </button>
            </div>
            <div
              *ngIf="photoUploadSuccess || photoUploadError"
              class="photo-messages"
            >
              <div *ngIf="photoUploadSuccess" class="success-message">
                Profile image updated successfully!
              </div>
              <div *ngIf="photoUploadError" class="error-message">
                {{ photoUploadError }}
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </section>
</div>

<main class="container">
  <!-- Profile Details (2-column responsive form) -->
  <section class="card form-card">
    <h2 class="form-title">Account Details</h2>
    <form
      [formGroup]="profileForm"
      (ngSubmit)="onSave()"
      class="form-grid"
      novalidate
    >
      <div class="form-field">
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" formControlName="name" />
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" readonly />
      </div>
      <div class="form-field">
        <label for="phone">Phone</label>
        <input id="phone" type="tel" formControlName="phone" />
      </div>
      <div class="form-field">
        <label for="dob">Date of Birth</label>
        <input id="dob" type="date" formControlName="dob" />
      </div>

      <div class="form-field">
        <label for="bloodGroup">Blood Group</label>
        <input
          id="bloodGroup"
          type="text"
          formControlName="bloodGroup"
          placeholder="e.g., A+, O-, B+"
        />
      </div>

      <div class="form-field span-2">
        <label for="address">Address</label>
        <textarea
          id="address"
          rows="3"
          formControlName="address"
          placeholder="Street, City, State, PIN"
        ></textarea>
      </div>

      <div class="form-actions span-2">
        <div class="buttons">
          <!-- <button
            type="button"
            class="btn btn-outline"
            (click)="loadPatientData()"
          >
            Reset
          </button> -->
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
        <div *ngIf="saved" class="save-indicator">Saved</div>
      </div>
    </form>
  </section>

  <!-- Security Card -->
  <section class="card form-card">
    <h2 class="form-title">Security</h2>
    <form
      [formGroup]="passwordForm"
      (ngSubmit)="onUpdatePassword()"
      class="form-grid"
      novalidate
    >
      <div class="form-field">
        <label for="currPass">Current Password</label>
        <input
          id="currPass"
          type="password"
          formControlName="currentPassword"
          placeholder="••••••••"
        />
      </div>
      <div class="form-field">
        <label for="newPass">New Password</label>
        <input
          id="newPass"
          type="password"
          formControlName="newPassword"
          placeholder="Min 8 chars"
        />
      </div>
      <div class="form-field">
        <label for="confirmPass">Confirm New Password</label>
        <input
          id="confirmPass"
          type="password"
          formControlName="confirmPassword"
          placeholder="Re-enter password"
        />
        <div
          *ngIf="
            passwordForm.get('confirmPassword')?.hasError('passwordMismatch')
          "
          class="error-message"
        >
          Passwords do not match
        </div>
      </div>
      <div class="form-actions">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="passwordForm.invalid"
        >
          Update Password
        </button>
      </div>
      <div *ngIf="passwordUpdateSuccess" class="success-message">
        Password updated successfully!
      </div>
      <div *ngIf="passwordUpdateError" class="error-message">
        {{ passwordUpdateError }}
      </div>
    </form>
  </section>
</main>
