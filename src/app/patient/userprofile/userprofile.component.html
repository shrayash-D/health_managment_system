<div class="page">
  <section class="hero">
    <div class="container">
      <div class="hero-inner">
        <!-- Left side content -->
        <div>
          <!-- Profile Header -->
          <section class="card profile-header">
            <div class="left">
              <div class="avatar" aria-hidden="true">
                <img
                  *ngIf="tempPhotoUrl || photoPreview; else initials"
                  [src]="tempPhotoUrl || photoPreview"
                  alt="avatar"
                />
                <ng-template #initials>
                  <div class="avatar-placeholder">{{ initials }}</div>
                </ng-template>
              </div>
              <div class="info">
                <h2 class="name">{{ displayName }}</h2>
                <div class="meta">
                  <span class="chip">Role: {{ displayRole }}</span>
                  <span class="chip">Member since: 2023</span>
                </div>
              </div>
            </div>
            <div class="actions">
              <input
                type="file"
                #fileInput
                accept="image/*"
                hidden
                (change)="onPhotoSelect($event)"
              />
              <button
                class="btn btn-outline"
                type="button"
                (click)="fileInput.click()"
              >
                Change photo
              </button>
              <button
                *ngIf="tempPhotoUrl"
                class="btn btn-primary"
                type="button"
                (click)="savePhoto()"
              >
                Save Photo
              </button>
              <button
                *ngIf="photoPreview || tempPhotoUrl"
                class="btn btn-outline"
                type="button"
                (click)="removePhoto()"
              >
                Remove photo
              </button>
            </div>
          </section>
        </div>
      </div>
    </div>
  </section>
</div>

<main class="container">
  <!-- Profile Details (2-column responsive form) -->
  <section class="card form-card">
    <h2 class="form-title">Account Details</h2>
    <form
      [formGroup]="profileForm"
      (ngSubmit)="onSave()"
      class="form-grid"
      novalidate
    >
      <div class="form-field">
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" formControlName="name" />
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" />
      </div>
      <div class="form-field">
        <label for="phone">Phone</label>
        <input id="phone" type="tel" formControlName="phone" />
      </div>
      <div class="form-field">
        <label for="dob">Date of Birth</label>
        <input id="dob" type="date" formControlName="dob" />
      </div>

      <div class="form-field span-2">
        <label for="address">Address</label>
        <textarea
          id="address"
          rows="3"
          formControlName="address"
          placeholder="Street, City, State, PIN"
        ></textarea>
      </div>

      <div class="form-actions span-2">
        <div class="buttons">
          <button type="button" class="btn btn-outline" (click)="ngOnInit()">
            Reset
          </button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
        <div *ngIf="saved" class="save-indicator">Saved</div>
      </div>
    </form>
  </section>

  <!-- Security Card -->
  <section class="card form-card">
    <h2 class="form-title">Security</h2>
    <form class="form-grid" novalidate>
      <div class="form-field">
        <label for="currPass">Current Password</label>
        <input id="currPass" type="password" placeholder="••••••••" />
      </div>
      <div class="form-field">
        <label for="newPass">New Password</label>
        <input id="newPass" type="password" placeholder="Min 8 chars" />
      </div>
      <div class="form-field">
        <label for="confirmPass">Confirm New Password</label>
        <input
          id="confirmPass"
          type="password"
          placeholder="Re-enter password"
        />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update Password</button>
      </div>
    </form>
  </section>
</main>
