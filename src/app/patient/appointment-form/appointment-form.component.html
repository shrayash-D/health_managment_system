<div class="page">
  <section class="hero">
    <div class="container">
      <div class="hero-inner">
        <h1>Appointment</h1>
        <p>Book, reschedule, or cancel appointments.</p>
      </div>
    </div>
  </section>

  <main class="container">
    <section class="card form-card">
      <h2 class="form-title">Appointment Details</h2>

      <!-- Loading indicator -->
      <div *ngIf="loading" class="loading-message">
        <p>Loading...</p>
      </div>

      <!-- Error message -->
      <div *ngIf="error" class="error-message span-2">
        {{ error }}
      </div>

      <form
        class="form-grid"
        [formGroup]="appointmentForm"
        (ngSubmit)="onSubmit()"
        novalidate
      >
        <div class="form-field">
          <label for="clinician"
            >Select Doctor <span class="required">*</span></label
          >
          <select
            id="clinician"
            formControlName="clinician"
            (change)="onDoctorChange($event)"
          >
            <option value="">Select a doctor</option>
            <option *ngFor="let doctor of doctors" [value]="doctor.id">
              {{ doctor.user?.name || "Unknown Doctor" }}
              <span *ngIf="doctor.specialization">
                - {{ doctor.specialization }}</span
              >
            </option>
          </select>
          <div
            class="error"
            *ngIf="
              appointmentForm.get('clinician')?.touched &&
              appointmentForm.get('clinician')?.invalid
            "
          >
            Doctor selection is required.
          </div>
        </div>

        <div class="form-field">
          <label for="appointmentDate"
            >Select Date <span class="required">*</span></label
          >
          <select
            id="appointmentDate"
            formControlName="appointmentDate"
            (change)="onDateChange($event)"
            [disabled]="availableDates.length === 0 || !selectedDoctorId"
          >
            <option value="">
              {{
                selectedDoctorId
                  ? "Select a date"
                  : "Please select a doctor first"
              }}
            </option>
            <option *ngFor="let date of availableDates" [value]="date">
              {{ date | date: "EEEE, MMMM d, y" }}
            </option>
          </select>
          <div
            class="error"
            *ngIf="
              appointmentForm.get('appointmentDate')?.touched &&
              appointmentForm.get('appointmentDate')?.invalid
            "
          >
            Date selection is required.
          </div>
        </div>

        <div class="form-field">
          <label for="slotId"
            >Select Time <span class="required">*</span></label
          >
          <select
            id="slotId"
            formControlName="slotId"
            [disabled]="availableTimesForDate.length === 0 || !selectedDate"
          >
            <option value="">
              {{
                selectedDate ? "Select a time" : "Please select a date first"
              }}
            </option>
            <option
              *ngFor="let slot of availableTimesForDate"
              [value]="slot.slotId"
            >
              {{ slot.timeDisplay }}
            </option>
          </select>
          <div
            class="error"
            *ngIf="
              appointmentForm.get('slotId')?.touched &&
              appointmentForm.get('slotId')?.invalid
            "
          >
            Time slot is required.
          </div>
        </div>

        <div class="form-field span-2">
          <label for="reason"
            >Reason for Visit <span class="required">*</span></label
          >
          <textarea
            id="reason"
            formControlName="reason"
            placeholder="Please describe your reason for the appointment..."
            rows="4"
          ></textarea>
          <div
            class="error"
            *ngIf="
              appointmentForm.get('reason')?.touched &&
              appointmentForm.get('reason')?.invalid
            "
          >
            Reason is required.
          </div>
        </div>

        <div class="form-actions span-2">
          <button
            type="button"
            class="btn btn-outline"
            (click)="resetForm()"
            [disabled]="loading"
          >
            Reset
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="loading || appointmentForm.invalid"
          >
            {{ loading ? "Booking..." : "Book Appointment" }}
          </button>
        </div>

        <div *ngIf="saved" class="success span-2">
          ✓ Appointment booked successfully!
        </div>
      </form>
    </section>
  </main>
</div>
