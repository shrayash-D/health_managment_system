<div class="patient-management">
  <!-- Header -->
  <div class="page-header">
    <h2>Patient Management</h2>
  </div>

  <!-- Search Bar -->
  <div class="search-bar">
    <input
      type="text"
      class="form-control input-brand"
      placeholder="Search patients by name, contact, or blood group..."
      [(ngModel)]="searchTerm"
    />
  </div>

  <!-- Patients Table -->
  <div class="table-container" *ngIf="patients$ | async as patients">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Contact</th>
          <th>Date of Birth</th>
          <th>Blood Group</th>
          <th>Primary Physician</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let patient of getFilteredPatients(patients)">
          <td>{{ patient.id }}</td>
          <td>
            <strong>{{ patient.name }}</strong>
          </td>
          <td>{{ patient.contactInfo }}</td>
          <td>{{ patient.dob }}</td>
          <td>
            <span class="badge badge-soft" *ngIf="patient.bloodGroup">{{
              patient.bloodGroup
            }}</span>
          </td>
          <td>{{ patient.primaryPhysician || "-" }}</td>
          <td>
            <div class="action-buttons">
              <button
                class="btn btn-sm btn-outline-warning"
                (click)="resetPassword(patient.id, patient.name)"
                title="Reset patient password"
              >
                Reset Password
              </button>
              <button
                class="btn btn-sm btn-outline-danger"
                (click)="deletePatient(patient.id)"
              >
                Delete
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="getFilteredPatients(patients).length === 0">
          <td colspan="7" class="text-center text-muted-500">
            No patients found
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
