<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <a
        routerLink="/"
        class="brand-logo"
        style="text-decoration: none; color: inherit"
      >
        <span class="brand-dot"></span>
        <span class="brand-text">HealthConnect</span>
      </a>
      <div class="admin-badge" *ngIf="badgeLabel">{{ badgeLabel }}</div>
    </div>

    <nav class="sidebar-nav">
      <a
        *ngFor="let item of menu"
        [routerLink]="item.link"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-text">{{ item.label }}</span>
      </a>

      <!-- When there is no menu (public route) show a simple link back home -->
      <a *ngIf="menu.length === 0" routerLink="/" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">Home</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <div class="admin-main">
    <!-- Header -->
    <header class="admin-header">
      <div class="header-left">
        <h1 class="page-title">{{ headerTitle }}</h1>
      </div>
      <div class="header-right">
        <div class="header-actions">
          <app-notifications
            [unreadCount]="unreadCount"
            [show]="showNotifications"
            [notifications]="[]"
            (toggle)="toggleNotifications()"
            (markAll)="markAllAsRead()"
            (markRead)="markAsRead($event)"
            (delete)="deleteNotification($event)"
          ></app-notifications>

          <div class="user-menu">
            <div class="user-avatar">A</div>
            <span class="user-name">{{ badgeLabel || "User" }}</span>
          </div>
          <a routerLink="/" class="btn-logout" (click)="logout()">Logout</a>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
