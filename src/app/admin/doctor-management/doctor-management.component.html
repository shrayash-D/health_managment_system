<div class="doctor-management">
  <!-- Header -->
  <div class="page-header">
    <h2>Doctor Management</h2>
  </div>

  <!-- Search Bar -->
  <div class="search-bar">
    <input
      type="text"
      class="form-control input-brand"
      placeholder="Search doctors by name, specialization, department, or email..."
      [(ngModel)]="searchTerm"
    />
  </div>

  <!-- Doctors Table -->
  <div class="table-container" *ngIf="doctors$ | async as doctors">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Specialization</th>
          <th>Department</th>
          <th>Contact</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let doctor of getFilteredDoctors(doctors)">
          <td>{{ doctor.id }}</td>
          <td>
            <strong>{{ doctor.user?.name || doctor.name || "N/A" }}</strong>
          </td>
          <td>{{ doctor.specialization }}</td>
          <td>{{ doctor.department || "-" }}</td>
          <td>{{ doctor.contactInfo || "-" }}</td>
          <td>{{ doctor.user?.email || doctor.email || "-" }}</td>
          <td>
            <div class="action-buttons">
              <button
                class="btn btn-sm btn-outline-warning"
                (click)="
                  resetPassword(
                    doctor.id,
                    doctor.user?.name || doctor.name || 'Doctor'
                  )
                "
                title="Reset doctor password"
              >
                Reset Password
              </button>
              <button
                class="btn btn-sm btn-outline-danger"
                (click)="deleteDoctor(doctor.id)"
              >
                Delete
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="getFilteredDoctors(doctors).length === 0">
          <td colspan="7" class="text-center text-muted-500">
            No doctors found
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
