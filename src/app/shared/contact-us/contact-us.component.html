
<div class="page">
  <section class="hero">
    <div class="container">
      <div class="hero-inner">
        <h1>Contact Us</h1>
        <p>Reach out for appointments, support, or general queries.</p>
      </div>
    </div>
  </section>

  <main class="container">
    <section class="card form-card">
      <h2 class="form-title">Send us a message</h2>

      <!-- Bind the form and handlers; keep classes as-is -->
      <form class="form-grid" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-field">
          <label for="fullName">Full Name</label>
          <input id="fullName" type="text" formControlName="fullName" placeholder="Enter your full name" />
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="name@example.com" />
        </div>

        <div class="form-field">
          <label for="phone">Phone</label>
          <input id="phone" type="tel" formControlName="phone" placeholder="+91 XXXXX XXXXX" />
        </div>

        <div class="form-field">
          <label for="subject">Subject</label>
          <input id="subject" type="text" formControlName="subject" placeholder="Query subject" />
        </div>

        <div class="form-field span-2">
          <label for="message">Message</label>
          <textarea id="message" rows="6" formControlName="message" placeholder="Write your message..."></textarea>
        </div>

        <div class="form-field">
          <label for="contactMethod">Preferred Contact</label>
          <select id="contactMethod" formControlName="contactMethod">
            <option *ngFor="let m of contactMethods" [value]="m">{{ m }}</option>
          </select>
        </div>

        <div class="form-field">
          <label for="urgency">Urgency</label>
          <select id="urgency" formControlName="urgency">
            <option *ngFor="let u of urgencies" [value]="u">{{ u }}</option>
          </select>
        </div>

        <div class="form-actions span-2">
          <label class="checkbox">
            <input type="checkbox" formControlName="consent" />
            <span>I agree to be contacted regarding my query</span>
          </label>

          <div class="buttons">
            <button type="button" class="btn btn-outline" (click)="onReset()" [disabled]="submitting()">
              Reset
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting()">
              Submit
            </button>
          </div>
        </div>
      </form>
    </section>
  </main>
</div>
