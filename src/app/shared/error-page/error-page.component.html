
<div class="error-container">
  <div class="error-card">
    <img src="assets/404-illustration.svg" alt="404 Illustration" class="error-illustration" />

    <h1 class="error-title">404</h1>
    <p class="error-subtitle">Oops! The page you are looking for does not exist.</p>

    <div class="error-actions">
      <a routerLink="/" class="btn btn-brand">Go Home</a>
      <button class="btn btn-outline-brand" (click)="goBack()">Go Back</button>
    </div>

    <div class="mt-4">
      <span class="badge-soft">Error Code: 404</span>
    </div>
  </div>
</div>
