<div class="notification-wrapper">
  <button class="notification-btn" title="Notifications" (click)="onToggle()">
    <span class="notification-icon">🔔</span>
    <span class="notification-badge" *ngIf="unreadCount > 0">{{
      unreadCount
    }}</span>
  </button>

  <div
    class="notifications-dropdown"
    *ngIf="show"
    (click)="$event.stopPropagation()"
  >
    <div class="notifications-header">
      <h4>Notifications</h4>
      <button
        class="btn-mark-all"
        (click)="onMarkAll()"
        *ngIf="unreadCount > 0"
      >
        Mark all as read
      </button>
    </div>
    <div class="notifications-list">
      <div
        *ngIf="!notifications || notifications.length === 0"
        class="no-notifications"
      >
        <span class="no-notifications-icon">🔕</span>
        <p>No notifications</p>
      </div>
      <div
        *ngFor="let n of notifications"
        class="notification-item"
        [class.unread]="!n.isRead"
        (click)="onMarkRead(n)"
      >
        <div class="notification-icon-wrapper">
          <span class="notification-type-icon">{{
            getNotificationIcon(n.type)
          }}</span>
        </div>
        <div class="notification-content">
          <div class="notification-title" *ngIf="n.title">{{ n.title }}</div>
          <div class="notification-message">
            {{ n.text || n.message || "New notification" }}
          </div>
          <div class="notification-time" *ngIf="n.time">{{ n.time }}</div>
        </div>
        <button
          class="btn-delete-notification"
          (click)="onDelete(n.id, $event)"
          title="Delete notification"
        >
          ×
        </button>
      </div>
    </div>
  </div>
</div>
